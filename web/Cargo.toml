[package]
name = "mandelbrot-web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mandelbrot = { path = "..", default-features = false }
wasm-bindgen = "0.2"

# WebGPU only exists in the browser, and natively the feature would pull GPU tests into
# `cargo test --workspace`
[target.'cfg(target_arch = "wasm32")'.dependencies]
mandelbrot = { path = "..", default-features = false, features = ["gpu"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
