[package]
name = "mandelbrot"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Marcos Traverso"]
readme = "README.md"

[workspace]
members = ["web"]

[features]
default = ["cli"]
cli = ["dep:clap", "image/default"]

[dependencies]
image = { version = "0.25.5", default-features = false }
rayon = "1.10.0"
clap = { version = "4.5.31", features = ["derive"], optional = true }

[dev-dependencies]
image = { version = "0.25.5", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "mandelbrot"
required-features = ["cli"]

[[bench]]
name = "render"
harness = false

[profile.wasm-release]
inherits = "release"
lto = true
codegen-units = 1
panic = "abort"
