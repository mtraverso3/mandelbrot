name: Benchmark

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        id: toolchain

      - name: Restore bench binary
        id: binary
        uses: actions/cache@v4
        with:
          path: dist/bench
          key: bench-bin-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'src/**', 'benches/**') }}

      - uses: Swatinem/rust-cache@v2
        if: steps.binary.outputs.cache-hit != 'true'

      - name: Build bench binary
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          executable=$(cargo bench --bench render --no-run --message-format=json \
            | jq -r 'select(.target.name == "render" and .executable != null) | .executable')
          install -D "$executable" dist/bench

      - uses: actions/upload-artifact@v4
        with:
          name: bench-bin
          path: dist/bench
          retention-days: 1

  baseline:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Find latest successful master run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow bench.yml --branch master \
            --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Baseline run: ${run_id:-none}"

  bench:
    needs: [build, baseline]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bench-bin
          path: dist

      - uses: actions/download-artifact@v4
        if: needs.baseline.outputs.run-id != ''
        continue-on-error: true
        with:
          name: bench-results
          path: baseline
          run-id: ${{ needs.baseline.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Run benchmarks
        run: |
          chmod +x dist/bench
          args=(--out bench-results)
          [ -f baseline/results.json ] && args+=(--baseline baseline)
          dist/bench "${args[@]}"

      - name: Job summary
        run: |
          cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rendered images and diffs are in the \`bench-results\` artifact." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results
          retention-days: 90

  publish:
    needs: bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bench-results
          path: bench-results

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            empty_tree=$(git hash-object -t tree /dev/null)
            commit=$(git commit-tree "$empty_tree" -m "Initialize gh-pages")
            git push origin "$commit:refs/heads/gh-pages"
          fi

      - name: Publish history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Mandelbrot benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results/results.json
          github-token: ${{ github.token }}
          auto-push: true
          alert-threshold: "125%"
          comment-on-alert: true
