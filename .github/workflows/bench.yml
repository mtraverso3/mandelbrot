name: Benchmark

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  refs:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.base.outputs.sha }}
    steps:
      - name: Resolve commit to compare against
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) sha="$PR_BASE" ;;
            push) sha="$BEFORE" ;;
            *) sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/master" --jq .sha) ;;
          esac
          if [ "$sha" = "$GITHUB_SHA" ] || [ -z "${sha//0/}" ]; then
            sha=""
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Base commit: ${sha:-none}"

  build:
    needs: refs
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.side == 'base' }}
    strategy:
      matrix:
        side: [head, base]
    env:
      REF: ${{ matrix.side == 'base' && needs.refs.outputs.base || github.sha }}
    steps:
      - name: Check for base commit
        if: env.REF == ''
        run: echo "No base commit to compare against"

      - uses: actions/checkout@v7
        if: env.REF != ''
        with:
          ref: ${{ matrix.side == 'base' && env.REF || '' }}

      - uses: dtolnay/rust-toolchain@stable
        if: env.REF != ''
        id: toolchain

      - name: Hash bench sources
        if: env.REF != ''
        id: sources
        run: echo "hash=$(git ls-tree -r HEAD -- Cargo.lock Cargo.toml src benches | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Restore bench binary
        if: env.REF != ''
        id: binary
        uses: actions/cache@v6
        with:
          path: dist/bench
          key: bench-bin-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ steps.sources.outputs.hash }}

      - uses: Swatinem/rust-cache@v2
        if: env.REF != '' && steps.binary.outputs.cache-hit != 'true'

      - name: Build bench binary
        if: env.REF != '' && steps.binary.outputs.cache-hit != 'true'
        run: |
          executable=$(cargo bench --bench render --no-run --message-format=json \
            | jq -r 'select(.target.name == "render" and .executable != null) | .executable')
          install -D "$executable" dist/bench

      - uses: actions/upload-artifact@v7
        if: env.REF != ''
        with:
          name: bench-bin-${{ matrix.side }}
          path: dist/bench
          retention-days: 1

  bench:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bench-bin-head
          path: dist/head

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: bench-bin-base
          path: dist/base

      - name: Run base benchmarks
        if: hashFiles('dist/base/bench') != ''
        continue-on-error: true
        run: |
          chmod +x dist/base/bench
          dist/base/bench --out baseline

      - name: Run head benchmarks
        run: |
          chmod +x dist/head/bench
          args=(--out bench-results)
          [ -f baseline/results.json ] && args+=(--baseline baseline)
          dist/head/bench "${args[@]}"

      - name: Job summary
        run: |
          cat bench-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rendered images and diffs are in the \`bench-results\` artifact." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results
          retention-days: 90

  publish:
    needs: bench
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: bench-results
          path: bench-results

      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            empty_tree=$(git hash-object -t tree /dev/null)
            commit=$(git commit-tree "$empty_tree" -m "Initialize gh-pages")
            git push origin "$commit:refs/heads/gh-pages"
          fi

      - name: Publish history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Mandelbrot benchmarks
          tool: customSmallerIsBetter
          output-file-path: bench-results/results.json
          github-token: ${{ github.token }}
          auto-push: true
          alert-threshold: "125%"
          comment-on-alert: true
